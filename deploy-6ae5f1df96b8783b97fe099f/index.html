<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Ciboff Gestão</title>

  <!-- Aplica o tema antes de renderizar (evita "piscar" claro→escuro) -->
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/receipt.css">
  <link rel="stylesheet" href="assets/css/tailwind.css">
</head>

<body class="h-full">
<div id="app" class="flex h-full flex-col">

  <!-- Barra superior -->
  <header class="app-surface border-app z-40 flex h-14 shrink-0 items-center gap-2 border-b px-2 sm:px-3">
    <button id="menu-toggle" type="button" class="icon-btn" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a href="#/inicio" class="flex items-center gap-2 pr-2" aria-label="Ciboff – início">
      <img src="assets/img/logo-ac.webp" alt="" class="h-9 w-auto shrink-0" width="48" height="36">
      <span class="logo-text font-display text-2xl font-bold leading-none">Ciboff</span>
    </a>
    <span class="hidden h-6 w-px bg-slate-200 dark:bg-slate-800 sm:block"></span>
    <h1 id="page-title" class="hidden truncate text-sm font-medium text-muted sm:block"></h1>

    <div class="ml-auto flex min-w-0 items-center gap-1.5 sm:gap-2">
      <span id="demo-badge" class="badge badge-gold hidden" title="Modo demonstração"><span class="sm:hidden">Demo</span><span class="hidden sm:inline">Demonstração</span></span>
      <a id="cash-status" href="#/financeiro" class="badge hidden"></a>
      <button id="theme-toggle" type="button" class="icon-btn" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <svg class="dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <div class="relative flex min-h-0 flex-1">
    <!-- Menu (hambúrguer): gaveta no celular, barra lateral recolhível no computador -->
    <div id="drawer-backdrop" class="fixed inset-0 top-14 z-40 hidden bg-black/30 backdrop-blur-[1px] lg:!hidden"></div>
    <aside id="sidebar" class="sidebar flex flex-col">
      <nav id="nav" class="scroll-thin flex-1 space-y-1 overflow-y-auto p-3" aria-label="Menu principal"></nav>
      <div class="border-app border-t p-4">
        <hr class="divider-gold mb-3">
        <div class="font-display text-sm font-semibold text-gold">Ciboff</div>
        <div class="text-xs text-muted">Sistema de gestão da loja</div>
        <div id="user-box" class="mt-3 hidden items-center justify-between gap-2 rounded-xl bg-slate-50 px-3 py-2 dark:bg-slate-800/60">
          <div class="min-w-0">
            <div id="user-email" class="truncate text-xs font-medium"></div>
            <div id="user-role" class="text-[11px] text-muted"></div>
          </div>
          <button id="sign-out" type="button" class="btn btn-sm">Sair</button>
        </div>
      </div>
    </aside>

    <main id="view" class="scroll-thin min-w-0 flex-1 overflow-y-auto"></main>
  </div>
</div>

<div id="print-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
